name: Validate distribution

on:
  workflow_call:
    inputs:
      run-runtime-tests:
        description: Run the Linux and macOS runtime matrices in addition to documentation checks
        type: boolean
        default: true
      upload-pages:
        description: Upload the validated documentation for a Pages deployment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  runtime:
    if: inputs.run-runtime-tests
    needs: build
    # setup-python has no Python 3.9 build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Install the candidate wheel
        run: |
          python -m pip install pytest dist/*.whl
          python -m pip check
      - name: Check the minimum supported psutil on Python 3.9
        if: matrix.python == '3.9'
        run: |
          python -m pip install psutil==5.8.0
          python -m pip check
      - name: Test packaged sources against the installed wheel
        env:
          PYTHONPATH: ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, tarfile, tempfile

          archive = next(Path('dist').glob('*.tar.gz')).resolve()
          directory = Path(tempfile.mkdtemp())
          with tarfile.open(archive) as source:
              source.extractall(directory)
          root = next(directory.iterdir())
          for path in ('tests/conftest.py', 'tests/__init__.py',
                       'tests/docker/Dockerfile', 'docs/architecture.md'):
              assert (root / path).is_file(), path
          subprocess.run([sys.executable, str(root / 'tests/smoke_distribution.py')],
                         cwd=directory, check=True)
          # While the endpoint-to-client test migration is underway, keep a
          # focused, independently collectable set visible before global pytest.
          focused = [
              'tests/test_remote_backend_options.py',
              'tests/test_remote_result_files_fetch.py',
              'tests/test_remote_run_context.py',
              'tests/test_optional_remote_output.py',
              'tests/test_remote_output_integrity.py',
              'tests/test_remote_endpoint_status.py',
              'tests/test_remote_stream_protocol.py',
              'tests/test_output_closure.py',
              'tests/test_endpoint_persistence.py',
              'tests/test_file_snapshots.py',
              'tests/test_reservations.py',
              'tests/test_attach_output_listener.py',
          ]
          subprocess.run([sys.executable, '-m', 'pytest', '-q', *focused],
                         cwd=root, check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q'], cwd=root, check=True)
          PY

  macos:
    if: inputs.run-runtime-tests
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Install the candidate wheel
        run: |
          python -m pip install pytest dist/*.whl
          python -m pip check
      - name: Test macOS execution, identity and reconnect
        env:
          PYTHONPATH: ''
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess, sys, tarfile, tempfile

          directory = Path(tempfile.mkdtemp())
          with tarfile.open(next(Path('dist').glob('*.tar.gz'))) as source:
              source.extractall(directory, filter='data')
          root = next(directory.iterdir())
          for arguments in (['--help'], ['status', '--help']):
              subprocess.run(['kkrunner', *arguments], cwd=directory, check=True)
          subprocess.run([sys.executable, str(root / 'tests/smoke_distribution.py')],
                         cwd=directory, check=True)
          tests = [
              'tests/test_package_structure.py',
              'tests/test_cli.py',
              'tests/test_run_model.py',
              'tests/test_run_record_schema.py',
              'tests/test_file_fingerprints.py',
              'tests/test_file_versions.py',
              'tests/test_transport.py',
              'tests/test_file_queries.py',
              'tests/test_process_identity.py',
              'tests/test_local_managed.py',
              'tests/test_local_status.py',
              'tests/test_remote_service.py',
              'tests/test_path_streams.py',
          ]
          subprocess.run([sys.executable, '-m', 'pytest', '-q', *tests],
                         cwd=root, check=True)
          PYCODE

  documentation:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Install the candidate wheel and documentation tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys

          wheel = next(Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', f'{wheel}[docs]'], check=True)
          PY
          python -m pip check
          python -c "import myst_parser, sphinx_rtd_theme"
      - name: Build HTML and execute examples from the source archive
        env:
          PYTHONPATH: ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, subprocess, tarfile, tempfile

          directory = Path(tempfile.mkdtemp())
          with tarfile.open(next(Path('dist').glob('*.tar.gz'))) as source:
              source.extractall(directory, filter='data')
          root = next(directory.iterdir())
          subprocess.run(['make', 'docs'], cwd=root, check=True)
          subprocess.run(['make', 'docs-test'], cwd=root, check=True)
          shutil.copytree(root / 'build/docs/html', 'site')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: site/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: inputs.upload-pages
        with:
          path: site/
